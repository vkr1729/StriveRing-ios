name: Build StriveRing iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select latest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer" && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve simulator destination
        id: sim
        run: |
          AVAILABLE="$(xcrun simctl list devices available)"
          echo "$AVAILABLE" | grep -E "iPhone|iPad" | head -10 || true
          if echo "$AVAILABLE" | grep -q "iPhone 17"; then
            echo 'destination=platform=iOS Simulator,name=iPhone 17,OS=latest' >> "$GITHUB_OUTPUT"
          else
            FALLBACK="$(echo "$AVAILABLE" | grep -oE 'iPhone [0-9]+( Pro( Max)?)?' | sort -uV | tail -1)"
            if [ -z "$FALLBACK" ]; then
              echo "No iOS simulator runtime on this runner; downloading the iOS platform."
              sudo xcodebuild -downloadPlatform iOS
              echo 'destination=platform=iOS Simulator,name=iPhone 17,OS=latest' >> "$GITHUB_OUTPUT"
            else
              echo "Using fallback simulator: $FALLBACK"
              echo "destination=platform=iOS Simulator,name=$FALLBACK,OS=latest" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run unit and simulator UAT
        run: |
          set -o pipefail
          xcodebuild test \
            -project StriveRing.xcodeproj \
            -scheme StriveRing \
            -destination '${{ steps.sim.outputs.destination }}' \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/StriveRing-UAT.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload simulator UAT evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StriveRing-simulator-UAT
          path: build/StriveRing-UAT.xcresult
          if-no-files-found: warn
          retention-days: 3

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build \
            -project StriveRing.xcodeproj \
            -scheme StriveRing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | xcbeautify

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/StriveRing.app build/Payload/
          cd build
          zip -qry StriveRing-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: StriveRing-unsigned-ipa
          path: build/StriveRing-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
