name: Build StriveRing iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit and simulator UAT
        run: |
          set -o pipefail
          xcodebuild test \
            -project StriveRing.xcodeproj \
            -scheme StriveRing \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/StriveRing-UAT.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload simulator UAT evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StriveRing-simulator-UAT
          path: build/StriveRing-UAT.xcresult
          if-no-files-found: warn
          retention-days: 3

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build \
            -project StriveRing.xcodeproj \
            -scheme StriveRing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | xcbeautify

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/StriveRing.app build/Payload/
          cd build
          zip -qry StriveRing-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: StriveRing-unsigned-ipa
          path: build/StriveRing-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
